# ==========================================
# Common Configuration (Applies to all profiles)
# ==========================================
spring:
  application:
    name: config-server
  # Set the default active profile here (change to 'git' to use the remote repo)
  profiles:
    active: git

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

---
# ==========================================
# Native Profile (Local File System)
# Used for local development to load config files directly from the classpath
# ==========================================
spring:
  config:
    activate:
      on-profile: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

---
# ==========================================
# Git Profile (Remote Repository)
# Used for staging/production to fetch config files from a central Git repo
# ==========================================
spring:
  config:
    activate:
      on-profile: git
  cloud:
    config:
      server:
        git:
          uri: https://github.com/isurahirantha/banking-platform-configs.git
          default-label: master
          # search-paths: <your-config-folder> # Uncomment if your config files are in a specific subfolder of the repo
          clone-on-start: true
